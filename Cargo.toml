[package]
name = "diktier"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lokales Push-to-Talk-Diktiertool"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

# Phase 1: exakt pinnen. parakeet-rs 0.3.7 ist die aktuelle Release (crates.io)
# und zieht ort 2.0.0-rc.13 (Wrapper für ONNX Runtime 1.28).
# default-features aus: parakeet-rs' `ort-defaults` aktiviert `ort/default`,
# das `download-binaries` enthält — verboten, ORT kommt als externe Library (§11).
# load-dynamic + api-28: Runtime-Laden per ort::init_from, C-API 1.28.
# ORT-Binary: ONNX Runtime CPU 1.28.0 (linux-x64), siehe scripts/fetch-ort.sh.
parakeet-rs = { version = "=0.3.7", default-features = false, features = ["cpu", "api-28", "load-dynamic"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-28"] }

# Phase 2b Capture: exakt pinnen.
# cpal 0.18.2: Default-Backend Linux = ALSA. Feature `pulseaudio` schaltet das
# native Pulse-Backend ein; zur Laufzeit PulseAudio vor ALSA. Auf Mint 22
# bedient pipewire-pulse den Pulse-Socket — das erreicht PipeWire, ohne
# libpipewire-0.3-dev (Feature `pipewire` bindgen't, Header fehlen hier).
# 0.18 verlangt explizites stream.play().
cpal = { version = "=0.18.2", features = ["pulseaudio"] }
# rubato 0.16.2: letzte 0.16-API mit FftFixedIn + process_partial (Flush).
# Nicht 1.x/4.x (AudioAdapter-Umbruch). FFT, kein Linear-Resampler (§6.4).
rubato = { version = "=0.16.2", default-features = true }

# Phase 2a Linux/X11: exakt pinnen.
# x11rb 0.13.2 ist die aktuelle 0.13-Patchversion (0.13.1 ist im Index nicht
# mehr wählbar). global-hotkey 0.8.0 verlangt ^0.13.1 — Cargo unifiziert auf
# eine Kopie. Features xtest (Paste-Key) und xkb (DETECTABLE_AUTO_REPEAT im
# XGrabKey-Fallback). 0.14 wäre API-bruch und eine zweite Kopie.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", features = ["xtest", "xkb"] }
# global-hotkey 0.8.0: Press+Release, XGrabKey, Auto-Repeat-Entprellung.
# Spec §3: erste Wahl; Fallback x11rb+XGrabKey hinter HotkeyBackend, falls
# Releases verloren gehen oder der Loop blockiert (siehe hotkey.rs).
global-hotkey = { version = "=0.8.0", default-features = false }

[dev-dependencies]
tempfile = "3"
