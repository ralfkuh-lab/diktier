[package]
name = "diktier"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Lokales Push-to-Talk-Diktiertool"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
# Phase 5 „Hotkey ändern…": Der Dialog schreibt nur die zwei `[hotkey]`-Zeilen
# zurück und muss die Kommentare der handgeschriebenen config.toml erhalten —
# `toml::to_string_pretty` würde sie verlieren. 0.22.27 steht ohnehin schon im
# Lock (transitiv über `toml` 0.8), der direkte Eintrag kostet keinen zweiten Baum.
toml_edit = "0.22"

# Phase 1: exakt pinnen. parakeet-rs 0.3.7 ist die aktuelle Release (crates.io)
# und zieht ort 2.0.0-rc.13 (Wrapper für ONNX Runtime 1.28).
# default-features aus: parakeet-rs' `ort-defaults` aktiviert `ort/default`,
# das `download-binaries` enthält — verboten, ORT kommt als externe Library (§11).
# load-dynamic + api-28: Runtime-Laden per ort::init_from, C-API 1.28.
# ORT-Binary: ONNX Runtime CPU 1.28.0 (win-x64), siehe scripts/fetch-ort.ps1.
parakeet-rs = { version = "=0.3.7", default-features = false, features = ["cpu", "api-28", "load-dynamic"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-28"] }

# Phase 2b Capture: exakt pinnen.
# cpal 0.18.2: Backend unter Windows ist WASAPI — Teil des Systems, keine
# zusätzliche Laufzeitabhängigkeit im Bundle (§11). Kein Feature nötig: die
# früher gesetzten Audio-Features waren allesamt Linux-Backends und sind mit
# der Plattform-Entscheidung 2026-08-27 entfallen.
# 0.18 verlangt explizites stream.play().
cpal = "=0.18.2"
# rubato 0.16.2: letzte 0.16-API mit FftFixedIn + process_partial (Flush).
# Nicht 1.x/4.x (AudioAdapter-Umbruch). FFT, kein Linear-Resampler (§6.4).
rubato = { version = "=0.16.2", default-features = true }

# Phase 3d Modell-Download (§6.3): exakt pinnen.
# ureq 3.4.0 ist blockierend und braucht keine Runtime — der Download läuft in
# einem eigenen Worker-Thread, nicht in der Event-Loop. `rustls` (ring +
# webpki-roots) statt native-tls: kein OpenSSL-Systemzwang, damit bleibt das
# Bundle aus §11 portabel. `gzip` bewusst AUS — die Artefakte sind bereits
# komprimiert, und ohne Content-Encoding stimmt die gelieferte Bytezahl direkt
# mit der Manifestgröße überein.
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }

# Phase 5 Windows (§3, §5): exakt pinnen.
# windows-sys 0.61.2 steht ohnehin schon transitiv im Lock (u. a. über
# cpal/ureq/rustls) — dieselbe Version direkt zu ziehen kostet keinen zweiten
# Baum und keine zweite `windows-link`-Kopie. Kein `windows`-Crate: dessen
# COM-/RAII-Schicht wird hier nirgends gebraucht, die rohen `extern "system"`-
# Signaturen von windows-sys reichen und bleiben in `unsafe`-Blöcken sichtbar.
#
# Features wachsen mit den Arbeitspaketen; hier steht, was WP2 (Hotkey,
# `WH_KEYBOARD_LL`) und WP3 (Inject: Clipboard + `SendInput`) tatsächlich
# aufrufen — die vollständige API→Feature-Tabelle für WP4/WP5 liegt in
# docs/windows-plan.md WP1.
#   Win32_Foundation                 WP2: WPARAM/LPARAM/LRESULT, GetLastError
#                                    WP3: HWND/HANDLE/HGLOBAL, CloseHandle,
#                                         GlobalFree, ERROR_CLASS_ALREADY_EXISTS
#   Win32_UI_WindowsAndMessaging     WP2: SetWindowsHookExW, CallNextHookEx,
#                                         UnhookWindowsHookEx, GetMessageW,
#                                         PeekMessageW, PostThreadMessageW, MSG,
#                                         KBDLLHOOKSTRUCT, LLKHF_*, WM_*
#                                    WP3: RegisterClassW/WNDCLASSW,
#                                         CreateWindowExW/CREATESTRUCTW,
#                                         DefWindowProcW, DestroyWindow,
#                                         UnregisterClassW, DispatchMessageW,
#                                         MsgWaitForMultipleObjects/QS_ALLINPUT,
#                                         Get/SetWindowLongPtrW (GWLP_USERDATA),
#                                         HWND_MESSAGE, GetForegroundWindow,
#                                         GetWindowThreadProcessId,
#                                         WM_RENDER*/WM_DESTROYCLIPBOARD
#   Win32_UI_Input_KeyboardAndMouse  WP2: GetAsyncKeyState, VK_*
#                                    WP3: SendInput, INPUT/KEYBDINPUT,
#                                         KEYEVENTF_*
#   Win32_System_LibraryLoader       GetModuleHandleW (HINSTANCE für Hook und
#                                    Fensterklasse)
#   Win32_System_Threading           WP2: GetCurrentThreadId (Ziel für
#                                         PostThreadMessageW)
#                                    WP3: OpenProcess,
#                                         QueryFullProcessImageNameW,
#                                         PROCESS_QUERY_LIMITED_INFORMATION
#   Win32_System_DataExchange        WP3: OpenClipboard, CloseClipboard,
#                                         EmptyClipboard, SetClipboardData,
#                                         GetClipboardData, GetClipboardOwner,
#                                         GetClipboardSequenceNumber,
#                                         IsClipboardFormatAvailable,
#                                         CountClipboardFormats
#   Win32_System_Memory              WP3: GlobalAlloc/Lock/Unlock/Size,
#                                         GMEM_MOVEABLE
#   Win32_Graphics_Gdi               WP3: nur als Typ-Voraussetzung —
#                                    windows-sys stellt WNDCLASSW/RegisterClassW
#                                    erst mit diesem Feature bereit (hbrBackground
#                                    ist ein HBRUSH).
#                                    WP4: CreateDIBSection, CreateBitmap,
#                                         DeleteObject, BITMAPINFO, BI_RGB,
#                                         DIB_RGB_COLORS
#                                    Overlay: CreateCompatibleDC, SelectObject,
#                                         DeleteDC, BLENDFUNCTION, AC_SRC_OVER,
#                                         AC_SRC_ALPHA, MonitorFromWindow,
#                                         MonitorFromPoint, GetMonitorInfoW,
#                                         MONITORINFO, MONITOR_DEFAULTTO*
#   Win32_UI_HiDpi                   Overlay (WP-O2): SetThreadDpiAwarenessContext,
#                                         DPI_AWARENESS_CONTEXT_PER_MONITOR_AWARE_V2,
#                                         GetDpiForWindow. Per-Thread-PMv2 auf
#                                         dem Overlay-Thread; prozessweite
#                                         Awareness (Manifest) bleibt bewusst
#                                         außen vor, siehe docs/overlay-plan.md.
#                                         **Nicht** GetDpiForMonitor: laut MS
#                                         nicht DPI-aware, richtet sich nach der
#                                         Prozess-Awareness (Sol-Impl-Review,
#                                         Blocker 1).
#   Win32_UI_Shell                   WP4: Shell_NotifyIconW, NOTIFYICONDATAW,
#                                         NIM_*, NIF_*, NIN_SELECT,
#                                         NIN_KEYSELECT, NOTIFYICON_VERSION_4
#   Win32_System_Console             WP5: SetConsoleCtrlHandler, AttachConsole,
#                                         ATTACH_PARENT_PROCESS, GetStdHandle,
#                                         SetStdHandle, CTRL_*_EVENT
#   Win32_Security                   WP5: nur als Typ-Voraussetzung —
#                                    windows-sys deklariert CreateMutexW mit
#                                    `*const SECURITY_ATTRIBUTES` und blendet es
#                                    ohne dieses Feature aus. Übergeben wird
#                                    NULL (Default-DACL).
#   Win32_Storage_FileSystem         WP5: CreateFileW für CONOUT$/CONIN$ —
#                                    AttachConsole hängt die Konsole an, setzt
#                                    aber die Standardhandles eines
#                                    GUI-Subsystem-Prozesses nicht.
#
# WP4 nutzt aus Win32_UI_WindowsAndMessaging zusätzlich: RegisterWindowMessageW,
# CreatePopupMenu/AppendMenuW/TrackPopupMenu/DestroyMenu, SetForegroundWindow,
# PostMessageW, GetSystemMetrics/SM_CXSMICON, CreateIconIndirect/DestroyIcon/
# ICONINFO, WM_QUERYENDSESSION/WM_ENDSESSION/WM_CONTEXTMENU/WM_APP.
# WP5 nutzt aus Win32_Foundation zusätzlich ERROR_ALREADY_EXISTS/
# ERROR_INVALID_HANDLE und aus Win32_System_Threading CreateMutexW.
#
# Das Aufnahme-Overlay nutzt aus Win32_UI_WindowsAndMessaging zusätzlich:
# UpdateLayeredWindow/ULW_ALPHA, WS_EX_LAYERED/NOACTIVATE/TRANSPARENT/TOPMOST,
# SW_SHOWNOACTIVATE/SW_HIDE, SetWindowPos/SWP_NOACTIVATE/SWP_NOZORDER (
# DPI-Bootstrap), WM_NCHITTEST/HTTRANSPARENT, WM_DPICHANGED, WM_DISPLAYCHANGE,
# WM_SETTINGCHANGE/SPI_SETWORKAREA — und aus Win32_Foundation POINT/SIZE/RECT.
#
# Nicht aufgenommen: Win32_System_Ole, das in 0.61 nur CF_UNICODETEXT liefern
# würde. Der Wert (13) ist stabile winuser.h-ABI und steht als Konstante in
# src/inject/windows.rs — ein COM-Feature dafür wäre unverhältnismäßig.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# Phase 5, Paket F: Exe-Icon und Versionsressource (build.rs).
# winresource 0.1.31 ist ein reiner Wrapper um `rc.exe` aus dem Windows SDK
# (bzw. `llvm-rc`); vier neue Lock-Knoten (winresource, toml 1.x,
# serde_spanned, toml_writer), kein Code zur Laufzeit. Host-cfg, weil die
# Ressource beim Bauen auf dem Windows-Host über `rc.exe` entsteht.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

