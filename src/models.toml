# Artefakt-Manifest (Spec §6.2, §6.3): ein Eintrag je freigegebenem
# Modellschlüssel, ein Artefaktvertrag pro Schlüssel — andere Bytes bekommen
# einen neuen Schlüssel. `engine.model` wählt genau einen Eintrag.
#
# Herkunft steht strukturiert je Modell (`source`, `repository`, `revision`
# bzw. `release_tag`); jede URL muss daraus exakt folgen (download.rs prüft das,
# scripts\release.ps1 schreibt daraus versions.toml, §11). Unveränderlich heißt
# Hugging-Face `resolve/<git-commit>/…` oder Asset eines immutable
# GitHub-Releases.

# Default für `engine.model` — muss `config::DEFAULT_MODEL` sein.
